name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history + tags, for the "바뀐 점" list in the release notes

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Optional stable signing key: add repository secrets ANUKI_KEYSTORE_B64 and ANUKI_KEYSTORE_PASS.
      # (secrets registered under the earlier NYANG_* names keep working)
      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.ANUKI_KEYSTORE_B64 || secrets.NYANG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/anuki.jks"
            echo "ANUKI_KEYSTORE=$RUNNER_TEMP/anuki.jks" >> "$GITHUB_ENV"
            echo "SIGNED_WITH=release" >> "$GITHUB_ENV"
          else
            echo "SIGNED_WITH=debug" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          ANUKI_KEYSTORE_PASS: ${{ secrets.ANUKI_KEYSTORE_PASS || secrets.NYANG_KEYSTORE_PASS }}
        run: |
          ./gradlew --no-daemon :app:assembleStandardRelease :app:assembleBadgeRelease
          cp app/build/outputs/apk/standard/release/app-standard-release.apk anuki-launcher.apk
          cp app/build/outputs/apk/badge/release/app-badge-release.apk anuki-launcher-badge.apk

      # The standard APK must not declare a notification listener (Play Protect blocks sideloads that do)
      - name: Check permissions in each APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          for f in anuki-launcher.apk anuki-launcher-badge.apk; do
            echo "== $f"
            "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$f" | grep -E "BIND_NOTIFICATION_LISTENER_SERVICE|BIND_ACCESSIBILITY_SERVICE|RECEIVE_SMS|READ_SMS" || echo "(none of the four)"
          done
          if "$BT/aapt2" dump xmltree --file AndroidManifest.xml anuki-launcher.apk | grep -q BIND_NOTIFICATION_LISTENER_SERVICE; then
            echo "standard APK declares a notification listener"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: anuki-launcher-apk
          path: |
            anuki-launcher.apk
            anuki-launcher-badge.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          if [ "$SIGNED_WITH" = "release" ]; then
            NOTE="고정 서명 키로 서명했어요. 이전 버전 위에 그대로 덮어 설치할 수 있어요."
          else
            NOTE="임시(디버그) 키로 서명했어요. 다음 버전을 설치하려면 먼저 지워야 할 수 있어요."
          fi
          # what changed since the previous (non-test) release: first line of each commit; the app shows this list
          PREV=$(gh api "repos/${{ github.repository }}/releases?per_page=30" --jq '[.[] | select(.prerelease|not)][0].tag_name' 2>/dev/null || true)
          if [ -n "$PREV" ] && git rev-parse -q --verify "refs/tags/$PREV" >/dev/null; then
            CHANGES=$(git log --no-merges --pretty=format:'- %s' "$PREV"..HEAD | { grep -v '^- 검사' || true; } | head -20)
          else
            CHANGES=$(git log -1 --pretty=format:'- %s')
          fi
          [ -z "$CHANGES" ] && CHANGES="- (바뀐 내용 없이 다시 빌드)"
          BODY="## 바뀐 점
          $CHANGES

          자동 빌드 (커밋 ${GITHUB_SHA::7}). $NOTE

          - anuki-launcher.apk: 기본판. 휴대폰에서 내려받아 설치하세요. 알림 배지는 없어요.
          - anuki-launcher-badge.apk: 알림 배지 포함판. 알림을 읽는 기능이 있어서 휴대폰에서 바로 설치하면 Google Play 프로텍트가 막을 수 있어요(일부 국가). 두 파일은 같은 앱이라 하나만 설치하세요."
          gh release create "$TAG" anuki-launcher.apk anuki-launcher-badge.apk \
            --title "아늑이 런처 $TAG" \
            --notes "$BODY" \
            --latest
